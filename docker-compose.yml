services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: civix
      POSTGRES_USER: civix
      POSTGRES_PASSWORD: civix_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civix -d civix"]
      interval: 5s
      timeout: 3s
      retries: 10

  django_web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      POSTGRES_DB: civix
      POSTGRES_USER: civix
      POSTGRES_PASSWORD: civix_pass
      POSTGRES_HOST: db
      ENV_TYPE: MICROSERVICIO
      NOTIFICACIONES_URL: http://flask_notificaciones:5000/api/v2/notificaciones/
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      flask_notificaciones:
        condition: service_started
    expose:
      - "8000"

  flask_notificaciones:
    build: ./flask_notificaciones
    environment:
      ENV_TYPE: DEV
    expose:
      - "5000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - django_web
      - flask_notificaciones

volumes:
  pgdata:
  media:
