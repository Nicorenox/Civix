<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civix | Crear proyecto</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .card {
            background: white;
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 8px 24px rgba(0,0,0,.08);
        }
        h1 { margin-top: 0; }
        .subtitle { color: #6b7280; margin-bottom: 25px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        .full { grid-column: 1 / -1; }
        label { display: block; font-weight: 600; margin-bottom: 7px; }
        input, textarea, select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }
        textarea { min-height: 120px; resize: vertical; }
        button {
            margin-top: 22px;
            border: 0;
            border-radius: 8px;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
        button:disabled { opacity: .6; cursor: wait; }
        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
        }
        .success { display: block; background: #dcfce7; color: #166534; }
        .error { display: block; background: #fee2e2; color: #991b1b; }
        code { word-break: break-all; }
        @media (max-width: 700px) {
            .grid { grid-template-columns: 1fr; }
            .full { grid-column: auto; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Crear proyecto</h1>
        <p class="subtitle">
            Civix · creación de proyectos mediante Builder + Service Layer + Factory.
        </p>

        <p><strong>Empresa:</strong> <code>{{ empresa.nombre }}</code></p>
        <p><strong>Correo:</strong> {{ empresa.correo }}</p>
        <p><strong>Plan:</strong> {{ empresa.plan }}</p>

        <form id="proyectoForm">
            {% csrf_token %}
            <div class="grid">
                <div class="full">
                    <label for="nombre">Nombre del proyecto *</label>
                    <input id="nombre" name="nombre" maxlength="150" required>
                </div>

                <div class="full">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion"></textarea>
                </div>

                <div>
                    <label for="fechaInicio">Fecha de inicio</label>
                    <input id="fechaInicio" name="fechaInicio" type="date">
                </div>

                <div>
                    <label for="fechaFin">Fecha de fin</label>
                    <input id="fechaFin" name="fechaFin" type="date">
                </div>
            </div>

            <button id="submitBtn" type="submit">Crear proyecto</button>
            <div id="message" class="message"></div>
        </form>
    </div>
</div>

<script>
const form = document.getElementById("proyectoForm");
const button = document.getElementById("submitBtn");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    message.className = "message";
    message.textContent = "";
    button.disabled = true;

    const payload = {
        nombre: document.getElementById("nombre").value.trim(),
        descripcion: document.getElementById("descripcion").value.trim(),
        fechaInicio: document.getElementById("fechaInicio").value || null,
        fechaFin: document.getElementById("fechaFin").value || null
    };

    try {
        const response = await fetch("{{ api_url }}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "No se pudo crear el proyecto.");
        }

        message.className = "message success";
        message.textContent =
            `Proyecto creado correctamente: ${data.nombre} (${data.estado}).`;

        form.reset();
    } catch (error) {
        message.className = "message error";
        message.textContent = error.message;
    } finally {
        button.disabled = false;
    }
});
</script>
</body>
</html>
