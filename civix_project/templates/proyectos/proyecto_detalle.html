{% load i18n %}
<!doctype html>
<html lang="{{ CURRENT_LANGUAGE|default:'es' }}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% trans "Detalle del proyecto" %} | Civix</title>
<style>
:root{--navy:#102347;--blue:#3478ef;--line:#e2e9f2;--muted:#68778e;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17243b;font-family:Inter,-apple-system,"Segoe UI",sans-serif}.top{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(5vw,24px)}.brand{font-weight:850;letter-spacing:.08em;color:var(--navy);text-decoration:none}.back{color:#385477;text-decoration:none;font-size:14px;font-weight:700}.wrap{max-width:1120px;margin:34px auto;padding:0 22px}.hero,.card{background:white;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 10px 28px #10234708}.hero{background:linear-gradient(120deg,#102347,#23477d);color:white}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#a8c7ff}.hero h1{font-size:clamp(28px,4vw,42px);margin:9px 0}.hero p{color:#d0dced;line-height:1.6;margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{display:inline-flex;padding:11px 16px;border-radius:9px;text-decoration:none;background:white;color:var(--navy);font-weight:750;font-size:13px}.btn.secondary{background:#ffffff1b;border:1px solid #ffffff55;color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:17px 0}.metric,.card{background:white;border:1px solid var(--line);border-radius:15px;padding:20px}.metric small{color:var(--muted)}.metric strong{display:block;margin-top:8px;font-size:20px;color:var(--navy)}.card{margin:16px 0}.card h2{margin:0 0 16px;color:var(--navy);font-size:20px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.field small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.field strong{line-height:1.5;overflow-wrap:anywhere}.progress{height:11px;background:#e9eff8;border-radius:20px;overflow:hidden;margin:14px 0 7px}.progress span{height:100%;background:linear-gradient(90deg,#3478ef,#0da979);display:block;border-radius:20px}.history{display:grid;gap:12px}.inspection{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px}.inspection h3{font-size:15px;margin:0 0 6px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.badge{display:inline-block;border-radius:20px;background:#edf4ff;color:#24539b;padding:5px 10px;font-size:11px;font-weight:750}.badge.pending{background:#fff4dd;color:#946200}.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;align-items:end;min-height:145px}.bar-wrap{display:grid;grid-template-rows:95px auto;gap:7px;text-align:center}.bar-track{height:95px;display:flex;align-items:end;justify-content:center;background:#f4f7fc;border-radius:9px 9px 0 0}.bar-track span{width:54%;min-height:4px;border-radius:7px 7px 0 0;background:linear-gradient(180deg,#4890ff,#3478ef)}.bar-wrap small{font-size:10px;color:var(--muted)}.empty{padding:20px;border-radius:10px;background:#f6f8fb;color:var(--muted)}.error{background:#fff1f1;color:#a32020;padding:16px;border-radius:10px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.fields{grid-template-columns:1fr}.inspection{grid-template-columns:1fr}.top{height:62px}}
</style></head>
<body>
<header class="top"><a href="/api/panel/#proyectos" class="brand">CIVIX</a><a class="back" href="/api/panel/#proyectos">← {% trans "Volver al panel" %}</a></header>
<main class="wrap" id="contenido"><div class="empty">{% trans "Cargando información del proyecto…" %}</div></main>
<script>
const PROYECTO_ID="{{ proyecto_id }}";
const TOKEN=localStorage.getItem("civix_token");
const T={login:"{% trans 'Tu sesión terminó. Inicia sesión para ver este proyecto.' %}",error:"{% trans 'No se pudo cargar el proyecto.' %}",sinInspecciones:"{% trans 'Este proyecto aún no tiene inspecciones registradas.' %}",sinAvances:"{% trans 'El historial de avance aparecerá cuando se confirmen inspecciones.' %}",avance:"{% trans 'Avance actual' %}",registrar:"{% trans 'Registrar inspección en este proyecto' %}",editar:"{% trans 'Volver a proyectos' %}",enEjecucion:"{% trans 'En ejecución' %}",pendiente:"{% trans 'Pendiente de confirmación' %}",confirmada:"{% trans 'Confirmada' %}",inicio:"{% trans 'Fecha de inicio' %}",fin:"{% trans 'Fecha de finalización' %}",presupuesto:"{% trans 'Presupuesto' %}",ciudad:"{% trans 'Ciudad' %}",tipo:"{% trans 'Tipo de proyecto' %}",estado:"{% trans 'Estado' %}",riesgo:"{% trans 'Riesgo' %}",descripcion:"{% trans 'Descripción' %}",responsable:"{% trans 'Responsable' %}",avanceHist:"{% trans 'Avances confirmados' %}",inspecciones:"{% trans 'Inspecciones y avances del proyecto' %}",sinDato:"{% trans 'No especificado' %}"};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fecha(s){if(!s)return T.sinDato;const d=new Date(`${s}T00:00:00`);return Number.isNaN(d.valueOf())?esc(s):new Intl.DateTimeFormat(document.documentElement.lang==="en"?"en-US":"es-CO").format(d);}
async function cargar(){
 if(!TOKEN){location.href="/api/login/";return;}
 const headers={Authorization:`Token ${TOKEN}`};
 try{
  const [rp,ri]=await Promise.all([fetch(`/api/proyectos/${encodeURIComponent(PROYECTO_ID)}/`,{headers}),fetch(`/api/proyectos/${encodeURIComponent(PROYECTO_ID)}/inspecciones/`,{headers})]);
  if(rp.status===401||ri.status===401){alert(T.login);location.href="/api/login/";return;}
  if(!rp.ok)throw new Error(T.error);
  const p=await rp.json(), inspecciones=ri.ok?await ri.json():[];
  const avance=Math.max(0,Math.min(100,Number(p.porcentaje_avance)||0));
  const confirmadas=inspecciones.filter(i=>i.estado==="confirmada").slice().reverse();
  const timeline=confirmadas.length?`<div class="timeline">${confirmadas.map(i=>`<div class="bar-wrap"><div class="bar-track"><span style="height:${Math.max(4,Number(i.porcentaje_avance_reportado)||0)}%" title="${esc(i.porcentaje_avance_reportado)}%"></span></div><small>${esc(fecha(i.fecha_visita))}<br>${esc(i.porcentaje_avance_reportado)}%</small></div>`).join("")}</div>`:`<div class="empty">${T.sinAvances}</div>`;
  const historial=inspecciones.length?`<div class="history">${inspecciones.map(i=>`<article class="inspection" id="inspeccion-${esc(i.id)}"><div><h3>${esc(i.tipo_inspeccion_display)} · ${esc(fecha(i.fecha_visita))}</h3><div class="muted">${esc(i.inspector_nombre)} · ${esc(i.fotografias?.length||0)} foto(s)<br>${esc(i.observaciones||T.sinDato)}</div></div><div><span class="badge ${i.estado==="pendiente"?"pending":""}">${esc(i.estado_display)}</span><p><strong>${esc(i.porcentaje_avance_reportado)}%</strong> reportado</p></div></article>`).join("")}</div>`:`<div class="empty">${T.sinInspecciones}</div>`;
  const money=p.presupuesto?new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(Number(p.presupuesto)):T.sinDato;
  document.getElementById("contenido").innerHTML=`<section class="hero"><span class="eyebrow">CIVIX · {% trans "Ficha de proyecto" %}</span><h1>${esc(p.nombre)}</h1><p>${esc(p.descripcion||T.sinDato)}</p><div class="actions"><a class="btn" href="/api/panel/?proyecto=${encodeURIComponent(p.id)}#inspecciones">${T.registrar}</a><a class="btn secondary" href="/api/panel/#proyectos">${T.editar}</a></div></section>
   <section class="grid"><div class="metric"><small>${T.avance}</small><strong>${avance.toFixed(1)}%</strong></div><div class="metric"><small>${T.estado}</small><strong>${esc(p.estado_display||p.estado)}</strong></div><div class="metric"><small>${T.riesgo}</small><strong>${esc(p.riesgo_display||p.riesgo)}</strong></div><div class="metric"><small>{% trans "Inspecciones registradas" %}</small><strong>${inspecciones.length}</strong></div></section>
   <section class="card"><h2>{% trans "Información general" %}</h2><div class="fields"><div class="field"><small>{% trans "Empresa" %}</small><strong>${esc(p.empresa_nombre||T.sinDato)}</strong></div><div class="field"><small>${T.ciudad}</small><strong>${esc(p.ciudad||T.sinDato)}</strong></div><div class="field"><small>${T.tipo}</small><strong>${esc(p.tipo_proyecto||T.sinDato)}</strong></div><div class="field"><small>${T.responsable}</small><strong>${esc(p.responsable_nombre||T.sinDato)}</strong></div><div class="field"><small>${T.inicio}</small><strong>${esc(fecha(p.fecha_inicio))}</strong></div><div class="field"><small>${T.fin}</small><strong>${esc(fecha(p.fecha_fin))}</strong></div><div class="field"><small>${T.presupuesto}</small><strong>${esc(money)}</strong></div></div><div class="progress"><span style="width:${avance}%"></span></div><small>${avance.toFixed(1)}% ${T.avance.toLocaleLowerCase()}</small></section>
   <section class="card"><h2>${T.avanceHist}</h2>${timeline}</section><section class="card"><h2>${T.inspecciones}</h2>${historial}</section>`;
 }catch(e){document.getElementById("contenido").innerHTML=`<div class="error">${esc(e.message||T.error)}</div>`;}
}
cargar();
</script></body></html>
