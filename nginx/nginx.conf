server {
    listen 80;
    # Nginx recibe tanto la IP como DuckDNS; Django valida el Host mediante
    # DJANGO_ALLOWED_HOSTS, configurado en el archivo .env de despliegue.
    server_name _;
    client_max_body_size 20M;   # fotografias de inspeccion

    # El endpoint de provisión solo se acepta dentro de la red Compose.
    location ^~ /api/internal/ { return 404; }

    # Catálogo y alta de cuenta pertenecen al microservicio de suscripciones.
    location /api/v2/suscripciones/ {
        proxy_pass http://flask_suscripciones:5001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # El endpoint extraído, la API aliada demo y el endpoint de información viven en Flask.
    location /api/v2/sistema/ {
        proxy_pass http://flask_notificaciones:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v2/aliado/ {
        proxy_pass http://flask_notificaciones:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Ruta ESTRANGULADA -> microservicio Flask (prefijo mas largo, gana sobre "/")
    location /api/v2/notificaciones/ {
        proxy_pass http://flask_notificaciones:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Archivos compilados y evidencias servidos por Nginx (no Django).
    location /static/ { alias /srv/static/; expires 7d; add_header Cache-Control "public"; }
    location /media/ { alias /srv/media/; }

    # Monolito legacy (incluye /api/..., /admin/, /media/, HTML)
    location / {
        proxy_pass http://django_web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
