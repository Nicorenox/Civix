server {
    listen 80;
    client_max_body_size 20M;   # fotografias de inspeccion

    # Ruta ESTRANGULADA -> microservicio Flask (prefijo mas largo, gana sobre "/")
    location /api/v2/notificaciones/ {
        proxy_pass http://flask_notificaciones:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Monolito legacy (incluye /api/..., /admin/, /media/, HTML)
    location / {
        proxy_pass http://django_web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
